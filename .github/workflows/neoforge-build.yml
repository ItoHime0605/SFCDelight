name: NeoForge Build (Java 21)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/neoforge-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Verify complete source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle
          test -f settings.gradle
          test -f src/main/java/tw/saltedfriedchicken/SaltedFriedChickenDelight.java
          test -f src/main/java/tw/saltedfriedchicken/FryingStationBlock.java
          test -f src/main/java/tw/saltedfriedchicken/FryingBasketBlock.java
          test -f src/main/java/tw/saltedfriedchicken/FriedBatchData.java
          java_count=$(find src/main/java -type f -name '*.java' | wc -l)
          json_count=$(find src/main/resources -type f -name '*.json' | wc -l)
          echo "Java files: $java_count; JSON resources: $json_count"
          test "$java_count" -ge 16
          test "$json_count" -ge 133

      - name: Validate 3x1x2 fixed cart, showcase and seasoning counter
        run: python3 src/test/python/validate_cart_layout.py

      - name: Validate six original fried-food pixel textures
        run: python3 src/test/python/validate_food_textures.py

      - name: Validate tabletop metal basket to fryer batch transfers
        run: python3 src/test/python/validate_metal_basket_flow.py

      - name: Validate one-portion food saturation and white pepper
        run: python3 src/test/python/validate_food_saturation.py

      - name: Validate preparation counter and sink
        run: python3 src/test/python/validate_preparation_counter.py

      - name: Validate chili shaker, speed effects and cart seasoning
        run: python3 src/test/python/validate_chili_seasoning.py

      - name: Validate garlic and basil satisfaction buff
        run: python3 src/test/python/validate_satisfaction.py

      - name: Validate five-stage fryer gauge
        run: python3 src/test/python/validate_fryer_gauge.py

      - name: Validate final bench and condiment previews
        run: python3 src/test/python/validate_ui_models.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'

      - name: Build NeoForge mod
        shell: bash
        run: |
          set -o pipefail
          gradle --version
          gradle --no-daemon --stacktrace build 2>&1 | tee gradle-build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfcdelight-build-log
          path: gradle-build.log
          if-no-files-found: warn

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sfcdelight-neoforge-1.21.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
