name: NeoForge Build (Java 21)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/neoforge-build.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'
      - name: Build NeoForge mod
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace build 2>&1 | tee gradle-build.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfcdelight-build-log
          path: gradle-build.log
          if-no-files-found: warn
      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sfcdelight-neoforge-1.21.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
