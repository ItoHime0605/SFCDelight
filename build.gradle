plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
version = project.mod_version
group = 'tw.saltedfriedchicken'
base { archivesName = 'SaltedFriedChickenDelight' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge { version = '21.1.262' }
repositories { mavenCentral() }

// Keep the mod metadata version synchronized with gradle.properties.
tasks.named('processResources', ProcessResources) {
    inputs.property('mod_version', project.mod_version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(mod_version: project.mod_version)
    }
}
